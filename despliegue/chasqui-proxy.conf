#
# Las cabeceras que el proxy le pasa a Chasqui. Se instala en
# /etc/nginx/chasqui-proxy.conf y lo incluye cada `location` de chasqui.nginx.
#
# Va en un archivo propio en vez de `include proxy_params` porque ese lo trae
# solo el paquete de Debian y Ubuntu: en Fedora, en RHEL o en la imagen oficial
# de nginx no existe, y Chasqui se instala en el servidor que tenga el cliente.

proxy_set_header Host              $host;

# X-Real-IP y NO X-Forwarded-For. nginx construye la segunda con
# $proxy_add_x_forwarded_for, que AÑADE al valor que ya traía la petición — así
# que su primer salto lo escribe quien llama. El freno de acceso de Chasqui lee
# X-Real-IP justamente por eso: leyendo la otra, cambiar de «origen» en cada
# intento saltaría el límite de contraseñas.
proxy_set_header X-Real-IP         $remote_addr;

# Para que Chasqui sepa que hacia fuera esto es https aunque le llegue en claro
# por el bucle local.
proxy_set_header X-Forwarded-Proto $scheme;

proxy_http_version 1.1;
proxy_set_header Connection        "";

# Un webhook que Chasqui tarda en atender no debe cortarse a medias: Meta lo
# reintentaría y el cliente recibiría la respuesta dos veces. 30 s es más de lo
# que tarda un caso bueno.
proxy_read_timeout 30s;
