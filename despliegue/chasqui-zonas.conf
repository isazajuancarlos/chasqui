#
# Las zonas de freno que usan los `location` de chasqui.nginx. Van en el bloque
# http{}, no dentro de un server{}, así que se instala en
# /etc/nginx/conf.d/chasqui-zonas.conf.
#
# Existe como ARCHIVO y no como comentario en la plantilla porque un `limit_req`
# que nombra una zona inexistente no arranca nginx: el vhost se copia, se
# recarga, y el servidor entero se queda abajo. Un comentario que hay que leer
# es peor salvaguarda que un archivo que se copia al lado.

limit_req_zone $binary_remote_addr zone=chasqui_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=chasqui_panel:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=chasqui_web:10m   rate=2r/s;
