# CI de chasqui. Nace el 2026-08-05, con el repositorio.
#
# POR QUÉ TAN TARDE, que es la lección y no un dato de archivo: chasqui vivía sin
# remoto y sin CI, así que `cargo clippy -- -D warnings` no lo había corrido
# nadie nunca. Al correrlo aparecieron DOS capas de avisos, y la segunda estaba
# TAPADA por la primera —clippy se para en el primer crate con errores—. Las 410
# pruebas pasaban, o sea que el repositorio parecía sano por el único lado que
# alguien miraba. No era que la deuda no existiera: era que el instrumento no.

name: CI

# CADA COMMIT SE PRUEBA UNA VEZ, no dos. Una rama con PR abierto dispara los DOS
# eventos sobre el mismo commit si `push` escucha en todas las ramas, y en un
# repositorio PRIVADO los minutos de Actions se facturan — el cupo de la cuenta
# ya se agotó una vez, el 2026-07-31.
#
# `push` se queda SOLO en `main`, que es lo que verifica el commit de fusión: el
# resultado de un squash no lo ha probado nadie hasta que existe.
#
# LO QUE DEJA FUERA, deliberado: una rama empujada SIN PR no tiene CI. El flujo
# es rama -> PR -> merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un empuje nuevo cancela la corrida anterior de la misma referencia. En `main`
# NO se cancela: cada commit de esa rama es un estado publicado y su resultado
# tiene que quedar registrado.
concurrency:
  # El `-{sha}` en `main` NO es adorno: `cancel-in-progress: false` solo salva a
  # la corrida EN CURSO — GitHub cancela las ENCOLADAS del mismo grupo. Con dos
  # merges dentro de una ventana de CI, el commit de en medio no se medía jamás
  # y la rama se veía verde por la corrida siguiente. Dándole a cada commit su
  # propio grupo, la promesa del comentario de arriba se cumple de verdad.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  # Menor privilegio: este CI solo prueba, con checkout de solo lectura. Sin este
  # bloque el GITHUB_TOKEN hereda permisos amplios.
  contents: read

jobs:
  rust:
    name: test + clippy
    runs-on: ubuntu-latest
    # El techo, no la duración esperada: sin él un CI que se degrada de 4 a 48
    # minutos sale verde igual. 30 y no los 20 del estándar porque este job
    # lleva 11 minutos ESTABLES (medido sobre las 5 últimas corridas, por job y
    # no por workflow): 20 dejaría 1,8x de margen y saltaría por operación
    # normal, que es la alarma que a la tercera nadie mira (directiva 21). Baja
    # a 20 cuando se mida el efecto del `opt-level` de las dependencias.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interfaz/package-lock.json
      # LA INTERFAZ SE CONSTRUYE ANTES DE PROBAR, y esto no es un adorno: la
      # primera versión de este workflow decía «no hace falta construirla, en
      # debug basta» y **la primera corrida del CI la puso en rojo**.
      #
      # `build.rs` empotra `interfaz/dist/interfaz/browser`, que NO viaja en el
      # repositorio; cuando falta, empotra una página de aviso que dice qué
      # ejecutar. Y `frontera_panel::el_panel_se_sirve_desde_el_binario` exige un
      # `<app-root>` en la raíz — existe exactamente para distinguir «hay un
      # rust-embed en el código» de «la interfaz está construida y empotrada».
      # En local pasaba porque `dist/` estaba ahí de una construcción anterior;
      # en un clon limpio, no. Es la directiva 28 cazando al propio CI.
      - name: interfaz
        run: npm ci && npm run build
        working-directory: interfaz
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` incluye pruebas y ejemplos: sin él, clippy no mira el
      # código de prueba, que es justo donde estaban los nueve avisos de la
      # primera capa.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `--no-fail-fast` NO es opcional: sin él, cargo test aborta en el primer
      # binario que falla y las pruebas de los otros crates no llegan a
      # ejecutarse — un rojo que además esconde el estado del resto.
      - name: test
        run: cargo test --workspace --no-fail-fast

  auditoria-deps:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    # El techo, no la duración esperada: sin él un CI que se
    # degrada de 4 a 48 minutos sale verde igual.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # El único ignore vive en .cargo/audit.toml, con su justificación medida.
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  cadena-suministro:
    name: cargo-deny (supply chain)
    runs-on: ubuntu-latest
    # El techo, no la duración esperada: sin él un CI que se
    # degrada de 4 a 48 minutos sale verde igual.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Exige que toda dependencia venga de una fuente autorizada —crates.io o
      # nuestro repositorio de guaca—, prohíbe comodines de versión y controla
      # licencias. Es la defensa contra que una dep se traiga de una fuente
      # inesperada (vector del ataque Atomic Arch). Config en deny.toml.
      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check

# NO HAY UN TRABAJO `interfaz` APARTE, y es deliberado desde el 2026-08-05.
# Lo hubo, y era redundante: el trabajo `rust` ya construye la interfaz porque
# sus pruebas la necesitan, así que un `ng build` en un segundo trabajo pagaba
# los mismos dos minutos para comprobar lo mismo. Si la interfaz no compila,
# `rust` se pone rojo en su paso `interfaz`, antes de tocar cargo.
#
# `npm test` NO se corre en ningún sitio, a propósito: está cableado a vitest y
# no hay ni un `.spec.ts`, así que daría cero pruebas — y cero pruebas no es
# verde, es nada. Cuando exista la primera, se añade al trabajo `rust`.
