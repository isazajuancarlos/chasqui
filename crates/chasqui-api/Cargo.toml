[package]
name = "chasqui-api"
description = "El servidor de Chasqui: webhooks de Meta, envío y panel."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "chasqui_api"
path = "src/lib.rs"

[[bin]]
name = "chasqui"
path = "src/main.rs"

[dependencies]
chasqui-dominio = { path = "../chasqui-dominio" }
chasqui-datos = { path = "../chasqui-datos" }
axum = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
clap = { version = "4", features = ["derive"] }
# La interfaz viaja DENTRO del binario: un solo ejecutable en el servidor del
# cliente, sin carpetas que copiar ni servidor de estáticos que configurar.
rust-embed = { version = "8", features = ["mime-guess"] }
guaca = { workspace = true }

[dev-dependencies]
# Para hablarle al servidor como le habla Meta: se levanta el binario de verdad
# y se le manda una petición HTTP firmada (directiva 28). `cookies` para hablarle
# al panel como le habla un navegador: si la sesión no viaja en la cookie, las
# pruebas del panel no prueban la sesión.
reqwest = { workspace = true, features = ["cookies"] }
