[package]
name = "chasqui-api"
description = "El servidor de Chasqui: webhooks de Meta, envío y panel."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "chasqui_api"
path = "src/lib.rs"

[[bin]]
name = "chasqui"
path = "src/main.rs"

[dependencies]
chasqui-dominio = { path = "../chasqui-dominio" }
chasqui-datos = { path = "../chasqui-datos" }
axum = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
clap = { version = "4", features = ["derive"] }
# El panel se teje EN EL SERVIDOR con maud (directiva 26): HTML compilado por
# rustc con los tipos del dominio dentro, sin Node ni npm en el build. htmx y la
# micro-librería `boi` van vendorizados y embebidos por `include_str!` (nunca
# CDN) — un solo ejecutable offline en el servidor del cliente.
maud = { version = "0.27", features = ["axum"] }
guaca = { workspace = true }

[dev-dependencies]
# Para hablarle al servidor como le habla Meta: se levanta el binario de verdad
# y se le manda una petición HTTP firmada (directiva 28). `cookies` para hablarle
# al panel como le habla un navegador: si la sesión no viaja en la cookie, las
# pruebas del panel no prueban la sesión.
reqwest = { workspace = true, features = ["cookies"] }
# El arnés de navegador. Aquí había 60 líneas propias —`buscar_chromium` y un
# `dibujar` de un tiro con `--dump-dom`— y `buscar_chromium` era copia literal
# de la de mirilla, que es la pieza compartida (directiva 9).
#
# Lo que se gana además de quitar la copia: la espera dice QUÉ esperaba. El
# `--virtual-time-budget=4000` de antes no costaba cuatro segundos de reloj
# —adelanta tiempo VIRTUAL, y medido son 1,85 s las dos pruebas—, así que el
# argumento no es la velocidad: es que al fallar no decía nada. `mirilla::esperar`
# espera la condición real y, al agotarse, imprime el DOM que había delante.
#
# NO se trae por la fuga —chasqui no tenía: medido, 22 perfiles antes de correr
# el banco y 22 después—, al revés de lo que decía la ficha #696.
mirilla = { git = "file:///home/juan/espejos/mirilla.git", rev = "c7de2e8" }

[lints]
workspace = true
